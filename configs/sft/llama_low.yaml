

# SFT stage: Llama 3.2 3B Instruct on D'_low.
name:        sft_llama_low
model_name:  meta-llama/Llama-3.2-3B-Instruct

data_path:   data/sft_low.jsonl
output_dir:  outputs/sft_low

# LoRA 
lora_r:                  16
lora_alpha:              32
lora_dropout:            0.05
lora_target_modules:     all-linear

# Training 
max_length:                       3072
per_device_train_batch_size:      2
gradient_accumulation_steps:      16        
learning_rate:                    2.0e-5
num_train_epochs:                 1
warmup_ratio:                     0.03
packing:                          false     

# Bookkeeping
save_steps:        500
save_total_limit:  2
seed:              42
report_to:         [wandb]
attn_implementation: sdpa
